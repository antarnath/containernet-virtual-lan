# ContainerNet — Phase 03: Dynamic Host Container Lifecycle
# All host containers are now spawned on demand by the backend via the
# Docker SDK. The static pc1/pc2/pc3 services are gone.

services:
  # ─── DATABASE ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: containernet_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: containernet
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - containernet_lan

  # ─── BACKEND ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: containernet_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/containernet
      # Phase 01 — Docker orchestration.
      # Mount the host's Docker socket so the backend can spawn containers.
      # For production, replace with a tcp://docker-proxy:2375 socket proxy.
      DOCKER_HOST: unix:///var/run/docker.sock
      # Phase 01 — Admin token gate.
      # Set to an empty string (or remove) in production to disable /api/admin/*.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-devsecret}
    volumes:
      # Gives the backend container access to the host's Docker daemon.
      # Equivalent to root on the host; use a socket proxy in production.
      - /var/run/docker.sock:/var/run/docker.sock
      # Live-edit backend Python source. We mount just ./backend/app
      # (not ./backend) so we don't clobber the image-installed
      # requirements.txt / wait-for-db.sh. Edits to *.py show up after
      # `docker compose restart backend`.
      - ./backend/app:/app/app:ro
      # The spawned host agents read /app/host-agent at runtime. We bind-mount
      # the host-agent folder here so edits are picked up by freshly-spawned
      # hosts without rebuilding the host-base image.
      - ./host-agent:/app/host-agent:ro
    # M2-07 §2.4 — per-project capture container requires the backend to
    # toggle the bridge's per-port promiscuous flag so host→host unicast
    # frames get flooded to the capture container's port. Without
    # pid=host + cap_add=NET_ADMIN, the backend's netns doesn't see the
    # host veths and can't write to /sys/class/net/<bridge>/brif/<veth>.
    pid: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - containernet_lan

  # ─── HOST BASE IMAGE (used by backend to spawn project hosts) ───
  # Not a running service — just a built image. The backend issues
  # `docker run containernet-host-base:latest ...` for every project host.
  host-base:
    build:
      context: .
      dockerfile: infra/hosts/host-base.Dockerfile
    image: containernet-host-base:latest
    networks:
      containernet_lan:
        aliases:
          - host-base

  # ─── CAPTURE BASE IMAGE (one per project, started lazily) ───────
  # M2-07 §2 — small Alpine + tcpdump + python3 image. The backend
  # spawns one container of this image per project and attaches it
  # only to that project's bridge so it can passively sniff frames.
  # Built but not run as a service.
  capture-base:
    build:
      context: .
      dockerfile: infra/hosts/capture-base.Dockerfile
    image: containernet-capture-base:latest

  # ─── FRONTEND (React + Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: containernet_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - containernet_lan

# ─── NETWORK ─────────────────────────────────────────────
# This is the backend's network. Spawned project hosts are attached to it
# (in addition to their own per-project bridge) so they can DNS-resolve
# `backend:8000` for heartbeats.
networks:
  containernet_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

volumes:
  pgdata:
